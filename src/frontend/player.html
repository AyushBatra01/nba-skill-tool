<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    <title>NBA Skills Leaderboard</title>
    <meta name="description" content="An interactive leaderboard displaying NBA player skills and performance percentiles.">
    -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <a href="index.html" class="back-link">← Leaderboard</a>
            <h1 id="player-name">Loading...</h1>
<!--            <p id="player-subtitle">-->
<!--                Loading player information...-->
<!--            </p>-->
        </div>
    </header>

    <section class="player-card glass-panel">
        <!--
        <div class="player-photo">
            <img id="player-headshot"
                 src="assets/default-player.png"
                 alt="Player Headshot">
        </div>
        -->
        <div class="player-info-grid">
            <div class="info-item">
                <span class="info-label">Height</span>
                <span id="player-height">6'8"</span>
            </div>
            <div class="info-item">
                <span class="info-label">Weight</span>
                <span id="player-weight">250 lb</span>
            </div>
<!--            <div class="info-item">-->
<!--                <span class="info-label">Age</span>-->
<!--                <span id="player-age">40</span>-->
<!--            </div>-->
            <div class="info-item">
                <span class="info-label">Experience</span>
                <span id="player-exp">22 Seasons</span>
            </div>
<!--            <div class="info-item">-->
<!--                <span class="info-label">Draft</span>-->
<!--                <span id="player-draft">2003 • #1 Overall</span>-->
<!--            </div>-->
            <div class="info-item">
                <span class="info-label">Current Team</span>
                <span id="player-team">Lakers</span>
            </div>
        </div>
    </section>

    <main class="app-main">
        <section class="controls glass-panel">
            <div class="control-group">
                <label for="table-type">Table Type</label>
                <select id="table-type">
                    <option value="overall">Overall</option>
                    <option value="skill">Skill</option>
                    <option value="pillar">Pillar</option>
                </select>
            </div>

            <div class="control-group" id="skill-group" style="display: none;">
                <label for="skill-select">Skill</label>
                <select id="skill-select">
                    <option value="Creation">Creation</option>
                    <option value="OffBall">Off-Ball</option>
                    <option value="Defense">Defense</option>
                    <option value="Physicality">Physicality</option>
                </select>
            </div>

            <div class="control-group" id="pillar-group" style="display: none;">
                <label for="pillar-select">Pillar</label>
                <select id="pillar-select">
                    <!-- Populated dynamically via JS based on selected skill -->
                </select>
            </div>

            <div class="control-group slider-group">
                <label for="min-minutes">Min Minutes: <span id="min-minutes-val">500</span></label>
                <div class="slider-container">
                    <input type="range" id="min-minutes" min="100" max="1000" step="50" value="500">
                </div>
                <div class="slider-ticks">
                    <span style="left:0%">100</span>
                    <span style="left:44.4%">500</span>
                    <span style="left:100%">1000</span>
                </div>
            </div>

            <div class="control-group button-group">
                <button id="update-btn" class="primary-btn">Update Table</button>
            </div>
        </section>

        <section class="table-container glass-panel">
            <div id="loading" class="loading-overlay" style="display: none;">
                <div class="spinner"></div>
            </div>
            <div class="table-scroll">
                <table id="player-table">
                    <thead>
                        <tr id="table-head-row">
                            <!-- Populated dynamically via JS -->
                        </tr>
                        <tr id="table-filter-row">
                            <!-- Populated dynamically via JS -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No data available for the selected filters.</p>
            </div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/table.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
